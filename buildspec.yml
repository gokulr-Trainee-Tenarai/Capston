version: 0.2

env:
  variables:
    GOPATH: "/go"
    GOCACHE: "/tmp/go-cache"
    HOME: "/root"

phases:
  install:
    commands:
      - mkdir -p /tmp/go-cache /go/bin /root
      - export PATH=$PATH:$GOPATH/bin
      - go install github.com/securego/gosec/v2/cmd/gosec@latest

  pre_build:
    commands:
      - echo "Running security scans..."
      - gosec -quiet ./... || true

  build:
    commands:
      - echo "Compiling service binaries into bin/..."
      - mkdir -p bin
      # Build native Linux binaries for each microservice
      - CGO_ENABLED=0 GOOS=linux go build -o bin/gateway ./gateway
      - CGO_ENABLED=0 GOOS=linux go build -o bin/auth ./auth
      - CGO_ENABLED=0 GOOS=linux go build -o bin/product ./product
      - CGO_ENABLED=0 GOOS=linux go build -o bin/order ./order

      # Ensure executable permissions
      - chmod +x bin/*

  post_build:
    commands:
      - echo "Generating Procfile..."
      # Generates a standard Procfile defining the startup processes
      - |
        cat <<EOF > Procfile
        web: ./bin/gateway
        auth: ./bin/auth
        product: ./bin/product
        order: ./bin/order
        EOF
      - echo "Build and packaging completed successfully."

artifacts:
  files:
    - 'bin/**/*'
    - 'Procfile'
  name: application-$(date +%Y-%m-%d-%H%M%S)
