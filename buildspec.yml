version: 0.2

env:
  variables:
    HOME: "/root"
    GOCACHE: "/tmp/go-cache"

phases:
  install:
    commands:
      - mkdir -p /tmp/go-cache
      - echo "Installing dependencies..."

  build:
    commands:
      - echo "Compiling Go binaries for Linux (amd64)..."
      - mkdir -p bin
      - cd gateway && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/gateway . && cd ..
      - cd auth && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/auth . && cd ..
      - cd product && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/product . && cd ..
      - cd order && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/order . && cd ..
      - cp bin/gateway application
      - chmod +x application bin/*

artifacts:
  files:
    - application
    - Procfile
    - bin/auth
    - bin/product
    - bin/order
    - bin/gateway
