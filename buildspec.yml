version: 0.2

phases:
  install:
    commands:
      - echo "Installing dependencies..."

  pre_build:
    commands:
      - echo "Running concurrency race tests..."
      - (cd order && go test -v ./tests/...)

  build:
    commands:
      - echo "Compiling Go binaries for Linux (amd64)..."
      - mkdir -p bin
      - (cd gateway && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/gateway .)
      - (cd auth && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/auth .)
      - (cd product && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/product .)
      - (cd order && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../bin/order .)
      - cp bin/gateway application
      - chmod +x application bin/*

artifacts:
  files:
    - application
    - Procfile
    - bin/auth
    - bin/product
    - bin/order
    - bin/gateway
